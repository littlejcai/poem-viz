server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # 部署在 learning.caistudio.cn/poem-viz 子路径下
    # Traefik 按 PathPrefix 转发但不剥前缀，所以这里用 alias 直接映射
    location = /poem-viz {
        return 301 /poem-viz/;
    }

    location /poem-viz/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }

    # 健康检查
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
